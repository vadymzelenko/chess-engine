<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Engine — Analytics</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <style>
        :root { color-scheme: dark; }
        body {
            background-color: #000000;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        #board {
            border: 1px solid #27272a;
            border-radius: 8px;
            overflow: hidden;
            filter: grayscale(20%) contrast(1.05);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 30px 60px -10px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .highlight-selected { position: relative; }
        .highlight-selected::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(34, 197, 94, 0.35);
            z-index: 1;
            pointer-events: none;
        }
        .highlight-move, .highlight-capture { position: relative; }
        .highlight-move::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32%; height: 32%;
            background: rgba(34, 197, 94, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }
        .highlight-capture::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; height: 85%;
            border: 4px solid rgba(34, 197, 94, 0.4);
            background: transparent;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }

        .panel {
            background: rgba(24,24,27,0.5);
            border: 1px solid rgba(63,63,70,0.6);
            border-radius: 12px;
            backdrop-filter: blur(6px);
        }
        .tab-btn {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 8px;
            color: #71717a;
            transition: all .15s;
        }
        .tab-btn.active { background: #fff; color: #09090b; }
        .tab-btn:not(.active):hover { color: #d4d4d8; }

        .metric-card {
            background: rgba(9,9,11,0.6);
            border: 1px solid rgba(63,63,70,0.5);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .metric-label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #71717a; }
        .metric-value { font-size: 17px; font-weight: 600; color: #fafafa; font-variant-numeric: tabular-nums; }

        .pv-row { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; font-size:12px; }
        .pv-row:hover { background: rgba(63,63,70,0.35); }

        .tree-node-tooltip {
            position: absolute;
            pointer-events: none;
            background: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            color: #e4e4e7;
            font-family: ui-monospace, monospace;
            white-space: nowrap;
            z-index: 50;
            display: none;
        }

        #treeCanvas, #evolutionChart, #depthChart, #heatmapCanvas { display:block; width:100%; }

        .glow-dot { box-shadow: 0 0 8px currentColor; }

        /* ---- Закрываемые панели ---- */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .panel-close-btn {
            width: 22px; height: 22px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            color: #52525b;
            flex-shrink: 0;
            transition: all .12s;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .panel-close-btn:hover { background: rgba(239,68,68,0.15); color: #f87171; }
        .panel-close-btn svg { width: 13px; height: 13px; }

        .widget-slot { transition: opacity .15s, transform .15s; }
        .widget-slot.hidden-widget { display: none !important; }

        #restoreBar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        #restoreBar:empty { display: none; }
        .restore-chip {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 10px 5px 12px;
            background: rgba(24,24,27,0.7);
            border: 1px dashed #3f3f46;
            border-radius: 999px;
            font-size: 11px;
            color: #a1a1aa;
            cursor: pointer;
            transition: all .12s;
        }
        .restore-chip:hover { border-color: #52525b; color: #e4e4e7; background: rgba(39,39,42,0.8); }
        .restore-chip svg { width: 11px; height: 11px; opacity: .7; }

        .chart-axis-label { font-size: 8.5px; fill: #71717a; font-family: ui-monospace, monospace; }
        .chart-grid-line { stroke: #27272a; stroke-width: 1; }
    </style>
</head>
<body class="text-zinc-200 min-h-screen overflow-y-auto flex flex-col items-center p-4 md:p-6 gap-4">

                    <div id="status" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded-md text-xs font-mono text-zinc-400 flex items-center gap-2">

                </div>
                <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider flex items-center justify-between px-1">
                    <span>История ходов</span>
                </div>
                <div id="history" class="h-32 bg-zinc-950/50 rounded-lg border border-zinc-800/50 p-3 overflow-y-auto font-mono text-sm text-zinc-400 grid grid-cols-2 gap-x-4 gap-y-1 content-start"></div>
            </div>

            <!-- Топ-линии + дерево -->
            <div id="widget-search" class="widget-slot panel p-4 flex flex-col gap-3 min-h-[500px]">

                    <svg id="treeSvg" class="w-full h-full" style="min-height:420px"></svg>
                    <div id="treeTooltip" class="tree-node-tooltip"></div>
                    <div class="absolute bottom-2 left-2 flex items-center gap-3 text-[10px] text-zinc-500 font-mono bg-zinc-950/70 px-2 py-1 rounded-md">

            <!-- Метрики -->

                    <button class="panel-close-btn" onclick="closeWidget('widget-metrics', 'Метрики поиска')" title="Скрыть">

                <div class="grid grid-cols-2 gap-2">

                    <div class="metric-card"><div class="metric-label">Оценка</div><div id="mScore" class="metric-value">—</div></div>

                    <div class="metric-card"><div class="metric-label">Время</div><div id="mTime" class="metric-value">—</div></div>

        <!-- НИЖНИЙ РЯД: дашборды -->
        <div id="dashboardRow" class="grid grid-cols-1 md:grid-cols-3 gap-4">

            <div id="widget-depthchart" class="widget-slot panel p-4 flex flex-col gap-2">
                <div class="panel-header">
                    <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Оценка по глубинам</div>
                    <button class="panel-close-btn" onclick="closeWidget('widget-depthchart', 'Оценка по глубинам')" title="Скрыть">

                    <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Эволюция оценки за партию</div>
                    <button class="panel-close-btn" onclick="closeWidget('widget-evolchart', 'Эволюция оценки')" title="Скрыть">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>

            <div id="widget-heatmap" class="widget-slot panel p-4 flex flex-col gap-2">
                <div class="panel-header">
                    <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider flex items-center gap-2">
                        <span>Heatmap фигур</span>
                        <span class="text-[10px] normal-case text-zinc-600">from + to</span>
                    </div>
                    <button class="panel-close-btn" onclick="closeWidget('widget-heatmap', 'Heatmap фигур')" title="Скрыть">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <svg id="heatmapCanvas" viewBox="0 0 320 160" class="w-full h-40"></svg>
            </div>
        </div>

    </div>

    <!-- ВОРКЕР ИИ -->
    <script id="worker-code" type="text/worker">
        importScripts('https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js');

        let customWeights = null;
        const engine = new Chess();

        const TIME_BUDGET_MS = 3500;
        const MAX_DEPTH = 64;
        const PROGRESS_INTERVAL_MS = 220; // несколько раз в секунду

        const DEFAULT_MATERIAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        const PST = {
            p: [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5,
                0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
            n: [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30,
                -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30,
                -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
            b: [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10,
                -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10,
                -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
            r: [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5,
                -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
            q: [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10,
                -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10,
                -20,-10,-10,-5,-5,-10,-10,-20],
            k: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30,
                -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10,
                20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20],
            k_end: [-50,-40,-30,-20,-20,-30,-40,-50, -30,-20,-10,0,0,-10,-20,-30, -30,-10,20,30,30,20,-10,-30,
                -30,-10,30,40,40,30,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,20,30,30,20,-10,-30,
                -30,-30,0,0,0,0,-30,-30, -50,-30,-30,-30,-30,-30,-30,-50]
        };

        function materialValue(type) {
            if (customWeights && customWeights[type] != null) return customWeights[type];
            return DEFAULT_MATERIAL[type];
        }

        let tt = new Map();
        const TT_MAX_SIZE = 200000;
        const TT_EXACT = 0, TT_LOWER = 1, TT_UPPER = 2;

        function ttKey(fen) {
            const parts = fen.split(' ');
            return parts.slice(0, 4).join(' ');
        }

        let nodeCount = 0;
        let pruneCount = 0;
        let deadline = 0;
        let searchStart = 0;
        let timeUp = false;
        let lastProgressPost = 0;

        // Снимок дерева на первых 2 уровнях от корня для визуализации
        let treeRoot = null;

        function checkTime() {
            if ((nodeCount & 511) === 0) {
                if (performance.now() > deadline) timeUp = true;
            }
        }

        function totalMaterial() {
            const board = engine.board();
            let total = 0;
            for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
                const p = board[i][j];
                if (p && p.type !== 'k') total += materialValue(p.type);
            }
            return total;
        }

        function evaluateBoard() {
            const board = engine.board();
            let score = 0;
            const endgame = totalMaterial() < 2600;
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = board[i][j];
                    if (!piece) continue;
                    let val = materialValue(piece.type);
                    let pstTable = piece.type === 'k' && endgame ? PST.k_end : PST[piece.type];
                    let idx = piece.color === 'w' ? (i * 8 + j) : ((7 - i) * 8 + j);
                    let pstVal = pstTable ? pstTable[idx] : 0;
                    const total = val + pstVal;
                    score += piece.color === 'w' ? total : -total;
                }
            }
            return engine.turn() === 'w' ? score : -score;
        }

        function scoreMove(m, ttMove) {
            if (ttMove && m.from === ttMove.slice(0,2) && m.to === ttMove.slice(2,4)) return 100000;
            let s = 0;
            if (m.flags.includes('c') || m.flags.includes('e')) {
                const victim = m.flags.includes('e') ? 100 : materialValue(m.captured);
                const attacker = materialValue(m.piece);
                s += 10000 + victim * 10 - attacker;
            }
            if (m.promotion) s += 9000;
            return s;
        }

        function orderMoves(moves, ttMove) {
            return moves.map(m => ({ m, s: scoreMove(m, ttMove) })).sort((a,b) => b.s - a.s).map(x => x.m);
        }

        function quiescence(alpha, beta, qdepth) {
            nodeCount++;
            checkTime();
            if (timeUp) return evaluateBoard();
            const standPat = evaluateBoard();
            if (standPat >= beta) return beta;
            if (standPat > alpha) alpha = standPat;
            if (qdepth <= 0) return standPat;
            const moves = engine.moves({ verbose: true }).filter(m => m.flags.includes('c') || m.flags.includes('e'));
            const ordered = orderMoves(moves, null);
            for (let i = 0; i < ordered.length; i++) {
                engine.move(ordered[i]);
                const score = -quiescence(-beta, -alpha, qdepth - 1);
                engine.undo();
                if (timeUp) return alpha;
                if (score >= beta) { pruneCount++; return beta; }
                if (score > alpha) alpha = score;
            }
            return alpha;
        }

        // treeNode: собираем только для верхних 2 уровней (root -> depth1 -> depth2), с ограничением по числу детей
        function alphaBeta(depth, alpha, beta, ply, treeNode) {
            nodeCount++;
            checkTime();
            if (timeUp) return 0;

            const key = ttKey(engine.fen());
            const entry = tt.get(key);
            let ttMove = null;
            if (entry) {
                ttMove = entry.move;
                if (entry.depth >= depth) {
                    if (entry.flag === TT_EXACT) return entry.score;
                    if (entry.flag === TT_LOWER && entry.score > alpha) alpha = entry.score;
                    else if (entry.flag === TT_UPPER && entry.score < beta) beta = entry.score;
                    if (alpha >= beta) return entry.score;
                }
            }

            if (depth === 0) return quiescence(alpha, beta, 4);

            const rawMoves = engine.moves({ verbose: true });
            if (rawMoves.length === 0) return engine.in_check() ? -99999 + ply : 0;

            const moves = orderMoves(rawMoves, ttMove);
            const collectChildren = treeNode && ply <= 2;
            const maxChildrenToTrack = ply === 1 ? 8 : 5;

            let bestScore = -Infinity;
            let bestMove = null;
            const alphaOrig = alpha;

            for (let i = 0; i < moves.length; i++) {
                let childNode = null;
                if (collectChildren && i < maxChildrenToTrack) {
                    childNode = { move: moves[i].san, from: moves[i].from, to: moves[i].to, children: [], status: 'searching', score: null };
                    treeNode.children.push(childNode);
                }

                engine.move(moves[i]);

                let score;
                if (i === 0) {
                    score = -alphaBeta(depth - 1, -beta, -alpha, ply + 1, childNode);
                } else {
                    // PVS: узкое окно для быстрой проверки, re-search полным окном только если ход оказался лучше alpha
                    score = -alphaBeta(depth - 1, -alpha - 1, -alpha, ply + 1, childNode);
                    if (score > alpha && score < beta && !timeUp) {
                        score = -alphaBeta(depth - 1, -beta, -alpha, ply + 1, childNode);
                    }
                }

                engine.undo();

                if (childNode) { childNode.score = score; childNode.status = 'explored'; }

                if (timeUp) return bestScore === -Infinity ? 0 : bestScore;

                if (score > bestScore) { bestScore = score; bestMove = moves[i]; }
                if (bestScore > alpha) alpha = bestScore;
                if (alpha >= beta) {
                    pruneCount++;
                    if (childNode) childNode.status = 'pruned';
                    // помечаем оставшиеся ещё не посчитанные как отсечённые
                    if (collectChildren) {
                        for (let k = i + 1; k < Math.min(moves.length, maxChildrenToTrack); k++) {
                            treeNode.children.push({ move: moves[k].san, from: moves[k].from, to: moves[k].to, children: [], status: 'pruned-skip', score: null });
                        }
                    }
                    break;
                }
            }

            if (treeNode && bestMove) {
                treeNode.bestChildMove = bestMove.san;
                for (const c of treeNode.children) c.status = (c.move === bestMove.san && c.status === 'explored') ? 'best' : c.status;
            }

            if (!timeUp) {
                let flag = TT_EXACT;
                if (bestScore <= alphaOrig) flag = TT_UPPER;
                else if (bestScore >= beta) flag = TT_LOWER;
                if (tt.size > TT_MAX_SIZE) tt.clear();
                tt.set(key, { depth, score: bestScore, flag, move: bestMove ? (bestMove.from + bestMove.to + (bestMove.promotion || '')) : null });
            }
            return bestScore;
        }

        function maybePostProgress(depth, rootLines, forced) {
            const now = performance.now();
            if (!forced && now - lastProgressPost < PROGRESS_INTERVAL_MS) return;
            lastProgressPost = now;
            const elapsed = now - searchStart;
            self.postMessage({
                type: 'PROGRESS',
                depth,
                nodes: nodeCount,
                prunes: pruneCount,
                elapsedMs: elapsed,
                nps: elapsed > 0 ? Math.round(nodeCount / (elapsed / 1000)) : 0,
                rootLines: rootLines.slice(0, 6),
                tree: treeRoot ? cloneTree(treeRoot) : null
            });
        }

        function cloneTree(node) {
            // ограничиваем глубину клонирования визуализации, чтобы не тормозить постинг
            return {
                move: node.move || 'root',
                score: node.score,
                status: node.status,
                children: (node.children || []).slice(0, 8).map(c => ({
                    move: c.move, score: c.score, status: c.status,
                    children: (c.children || []).slice(0, 5).map(g => ({ move: g.move, score: g.score, status: g.status, children: [] }))
                }))
            };
        }

        function searchBestMove(fen, timeBudgetMs) {
            engine.load(fen);
            nodeCount = 0;
            pruneCount = 0;
            timeUp = false;
            searchStart = performance.now();
            deadline = searchStart + timeBudgetMs;
            lastProgressPost = 0;

            const rootMoves = engine.moves({ verbose: true });
            if (rootMoves.length === 0) return { move: null, depth: 0 };
            if (rootMoves.length === 1) {
                const m = rootMoves[0];
                return { move: m.from + m.to + (m.promotion || ''), depth: 1 };
            }

            let bestMoveStr = null;
            let lastCompletedDepth = 0;
            let ttMove = null;
            const depthScoreHistory = [];

            for (let depth = 1; depth <= MAX_DEPTH; depth++) {
                let alpha = -Infinity, beta = Infinity;
                let bestScoreThisDepth = -Infinity;
                let bestMoveThisDepth = null;

                treeRoot = { move: 'root', score: null, status: 'root', children: [] };
                const moves = orderMoves(rootMoves, ttMove);
                const rootLines = [];

                for (let i = 0; i < moves.length; i++) {
                    let childNode = { move: moves[i].san, from: moves[i].from, to: moves[i].to, children: [], status: 'searching', score: null };
                    treeRoot.children.push(childNode);

                    engine.move(moves[i]);

                    let score;
                    if (i === 0) {
                        // Первый ход (обычно из TT / лучший с прошлой итерации) — полное окно,
                        // чтобы получить точную оценку и задать реальную планку alpha.
                        score = -alphaBeta(depth - 1, -beta, -alpha, 1, childNode);
                    } else {
                        // PVS: остальные ходы сначала узким окном (быстрая проверка "хуже ли он текущего лучшего").
                        score = -alphaBeta(depth - 1, -alpha - 1, -alpha, 1, childNode);
                        if (score > alpha && !timeUp) {
                            // Оказался не хуже — переисследуем полным окном, чтобы узнать НАСТОЯЩУЮ оценку,
                            // а не просто нижнюю границу.
                            score = -alphaBeta(depth - 1, -beta, -alpha, 1, childNode);
                        }
                    }

                    engine.undo();

                    childNode.score = score;
                    childNode.status = 'explored';

                    if (timeUp) break;

                    // rootLines может уже содержать этот ход из предыдущего re-search — заменяем, а не дублируем
                    const existingIdx = rootLines.findIndex(l => l.san === moves[i].san);
                    const lineEntry = { san: moves[i].san, from: moves[i].from, to: moves[i].to, score };
                    if (existingIdx >= 0) rootLines[existingIdx] = lineEntry;
                    else rootLines.push(lineEntry);
                    rootLines.sort((a,b) => b.score - a.score);

                    if (score > bestScoreThisDepth) { bestScoreThisDepth = score; bestMoveThisDepth = moves[i]; }
                    if (score > alpha) alpha = score;

                    maybePostProgress(depth, rootLines, false);
                }

                if (timeUp) { maybePostProgress(depth, rootLines, true); break; }

                if (bestMoveThisDepth) {
                    for (const c of treeRoot.children) if (c.move === bestMoveThisDepth.san) c.status = 'best';
                    bestMoveStr = bestMoveThisDepth.from + bestMoveThisDepth.to + (bestMoveThisDepth.promotion || '');
                    ttMove = bestMoveStr;
                    lastCompletedDepth = depth;
                    depthScoreHistory.push({ depth, score: bestScoreThisDepth });
                }

                maybePostProgress(depth, rootLines, true);

                if (performance.now() > deadline - 30) break;
                if (bestScoreThisDepth > 90000) break;
            }

            if (!bestMoveStr) {
                const m = rootMoves[0];
                bestMoveStr = m.from + m.to + (m.promotion || '');
            }

            return { move: bestMoveStr, depth: lastCompletedDepth, depthHistory: depthScoreHistory };
        }

        self.onmessage = async function(e) {
            const { type, fen } = e.data;

            if (type === 'INIT') {
                try {
                    const res = await fetch('/weights.json');
                    if (!res.ok) throw new Error('File not found');
                    customWeights = await res.json();
                    self.postMessage({ type: 'READY', msg: 'Готов (свои веса)' });
                } catch (error) {
                    self.postMessage({ type: 'READY', msg: 'Готов (базовые веса)' });
                }
            }

            if (type === 'SEARCH') {
                const result = searchBestMove(fen, TIME_BUDGET_MS);
                self.postMessage({
                    type: 'BEST_MOVE',
                    move: result.move,
                    depth: result.depth,
                    nodes: nodeCount,
                    prunes: pruneCount,
                    elapsedMs: performance.now() - searchStart,
                    depthHistory: result.depthHistory || []
                });
            }
        };
    </script>

    <!-- ЛОГИКА ИНТЕРФЕЙСА -->
    <script>
        const game = new Chess();
        const statusEl = document.getElementById('status');
        const historyEl = document.getElementById('history');
        const searchInfoEl = document.getElementById('searchInfo');
        const pvLineEl = document.getElementById('pvLine');
        let selectedSquare = null;

        // ---- Метрики DOM ----
        const mDepth = document.getElementById('mDepth');
        const mScore = document.getElementById('mScore');
        const mNodes = document.getElementById('mNodes');
        const mNps = document.getElementById('mNps');
        const mTime = document.getElementById('mTime');
        const mPrune = document.getElementById('mPrune');

        // ---- Состояние для дашбордов ----
        let evolutionHistory = []; // { ply, score } по партии, score с точки зрения белых
        let squareActivity = {};   // 'e4' -> count
        for (let f = 0; f < 8; f++) for (let r = 0; r < 8; r++) {
            squareActivity['abcdefgh'[f] + (r+1)] = 0;
        }
        let currentDepthHistory = [];

        function fmtScore(cp) {
            if (cp == null) return '—';
            if (Math.abs(cp) > 90000) {
                const mateIn = Math.ceil((99999 - Math.abs(cp)) / 1) ;
                return (cp > 0 ? '+M' : '-M') + Math.max(1, Math.round(mateIn/100));
            }
            const pawns = cp / 100;
            return (pawns > 0 ? '+' : '') + pawns.toFixed(2);
        }

        // ---------------- Tabs ----------------
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            document.getElementById('tab-tree').classList.toggle('hidden', tab !== 'tree');
            document.getElementById('tab-tree').classList.toggle('flex', tab === 'tree');
            document.getElementById('tab-lines').classList.toggle('hidden', tab !== 'lines');
            document.getElementById('tab-lines').classList.toggle('flex', tab === 'lines');
        };

        // ---------------- Закрытие / восстановление виджетов ----------------
        const restoreBar = document.getElementById('restoreBar');
        const closedWidgets = new Map(); // id -> label

        window.closeWidget = function(id, label) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.add('hidden-widget');
            closedWidgets.set(id, label);
            renderRestoreBar();
        };

        window.restoreWidget = function(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.remove('hidden-widget');
            closedWidgets.delete(id);
            renderRestoreBar();
            // после восстановления перерисовать графики/дерево, т.к. размеры SVG могли не считаться пока панель была скрыта
            if (id === 'widget-depthchart') renderDepthChart();
            if (id === 'widget-evolchart') renderEvolutionChart();
            if (id === 'widget-heatmap') renderHeatmap();
            if (id === 'widget-search' && window.__lastTree) renderTree(window.__lastTree);
        };

        function renderRestoreBar() {
            if (closedWidgets.size === 0) { restoreBar.innerHTML = ''; return; }
            let html = '';
            for (const [id, label] of closedWidgets) {
                html += `<button class="restore-chip" onclick="restoreWidget('${id}')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    ${label}
                </button>`;
            }
            restoreBar.innerHTML = html;
        }

        // ---------------- Дерево поиска (SVG) ----------------
        const treeSvg = document.getElementById('treeSvg');
        const treeTooltip = document.getElementById('treeTooltip');
        const NS = 'http://www.w3.org/2000/svg';

        function statusColor(status) {
            switch (status) {
                case 'best': return '#10b981';
                case 'pruned': case 'pruned-skip': return 'rgba(239,68,68,0.55)';
                case 'searching': return '#f59e0b';
                case 'root': return '#71717a';
                default: return '#52525b';
            }
        }

        function renderTree(tree) {
            treeSvg.innerHTML = '';
            if (!tree) return;

            const width = treeSvg.clientWidth || 600;
            const height = Math.max(treeSvg.clientHeight || 420, 420);
            treeSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);

            const levels = [[tree]];
            if (tree.children && tree.children.length) levels.push(tree.children);
            let level2 = [];
            for (const c of (tree.children || [])) {
                for (const g of (c.children || [])) level2.push({ node: g, parent: c });
            }
            if (level2.length) levels.push(level2.map(x => x.node));

            const levelY = [40, height * 0.48, height - 30];
            const positions = new Map(); // node -> {x,y}

            // root
            positions.set(tree, { x: width/2, y: levelY[0] });

            // level 1
            const l1 = tree.children || [];
            const l1Width = width - 60;
            l1.forEach((c, i) => {
                const x = l1.length === 1 ? width/2 : 30 + (l1Width * i / (l1.length - 1));
                positions.set(c, { x, y: levelY[1] });
            });

            // level 2 grouped under each parent
            l1.forEach((c) => {
                const kids = c.children || [];
                const parentPos = positions.get(c);
                const span = Math.min(140, (width / Math.max(l1.length,1)) - 10);
                kids.forEach((g, i) => {
                    const x = kids.length === 1 ? parentPos.x : parentPos.x - span/2 + (span * i / (kids.length - 1));
                    positions.set(g, { x, y: levelY[2] });
                });
            });

            function drawEdge(p1, p2, status) {
                const line = document.createElementNS(NS, 'line');
                line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y + 10);
                line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y - 10);
                line.setAttribute('stroke', status === 'pruned' || status === 'pruned-skip' ? 'rgba(239,68,68,0.25)' : 'rgba(113,113,122,0.35)');
                line.setAttribute('stroke-width', '1.5');
                treeSvg.appendChild(line);
            }

            function drawNode(node, pos, r) {
                const g = document.createElementNS(NS, 'g');
                g.style.cursor = 'pointer';

                const circle = document.createElementNS(NS, 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', r);
                circle.setAttribute('fill', statusColor(node.status));
                circle.setAttribute('stroke', '#09090b');
                circle.setAttribute('stroke-width', '1');
                if (node.status === 'best') circle.setAttribute('filter', 'drop-shadow(0 0 4px rgba(16,185,129,0.8))');
                g.appendChild(circle);

                if (node.move && node.move !== 'root') {
                    const label = document.createElementNS(NS, 'text');
                    label.setAttribute('x', pos.x);
                    label.setAttribute('y', pos.y + r + 12);
                    label.setAttribute('text-anchor', 'middle');
                    label.setAttribute('font-size', '9');
                    label.setAttribute('font-family', 'ui-monospace, monospace');
                    label.setAttribute('fill', node.status === 'best' ? '#a7f3d0' : '#a1a1aa');
                    label.textContent = node.move;
                    g.appendChild(label);
                }

                g.addEventListener('mousemove', (ev) => {
                    treeTooltip.style.display = 'block';
                    treeTooltip.style.left = (ev.offsetX + 14) + 'px';
                    treeTooltip.style.top = (ev.offsetY + 4) + 'px';
                    const scoreTxt = node.score != null ? fmtScore(node.score) : '...';
                    treeTooltip.innerHTML = `<b>${node.move || 'root'}</b> · ${scoreTxt} · ${node.status || ''}`;
                });
                g.addEventListener('mouseleave', () => { treeTooltip.style.display = 'none'; });

                treeSvg.appendChild(g);
            }

            // edges first (behind nodes)
            l1.forEach(c => drawEdge(positions.get(tree), positions.get(c), c.status));
            l1.forEach(c => (c.children || []).forEach(g => drawEdge(positions.get(c), positions.get(g), g.status)));

            drawNode(tree, positions.get(tree), 9);
            l1.forEach(c => drawNode(c, positions.get(c), 7));
            l1.forEach(c => (c.children || []).forEach(g => drawNode(g, positions.get(g), 4.5)));
        }

        // ---------------- Топ-линии панель ----------------
        function renderTopLines(lines) {
            const el = document.getElementById('tab-lines');
            if (!lines || lines.length === 0) { el.innerHTML = '<div class="text-zinc-600 text-xs p-2">Пока нет данных...</div>'; return; }
            el.innerHTML = lines.map((l, i) => {
                const barWidth = Math.max(4, Math.min(100, 50 + l.score / 20));
                return `<div class="pv-row">
                    <span class="text-zinc-600 w-4 text-right">${i+1}</span>
                    <span class="font-mono text-zinc-200 w-16">${l.san}</span>
                    <span class="font-mono ${l.score >= 0 ? 'text-emerald-400' : 'text-red-400'} w-14">${fmtScore(l.score)}</span>
                    <div class="flex-1 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                        <div class="h-full ${l.score >= 0 ? 'bg-emerald-500' : 'bg-red-500'}" style="width:${barWidth}%"></div>
                    </div>
                </div>`;
            }).join('');
        }

        // ---------------- Графики (SVG line charts, с нормальными осями) ----------------
        function niceStep(range, targetTicks) {
            if (range <= 0) return 1;
            const rough = range / targetTicks;
            const mag = Math.pow(10, Math.floor(Math.log10(rough)));
            const norm = rough / mag;
            let step;
            if (norm < 1.5) step = 1;
            else if (norm < 3) step = 2;
            else if (norm < 7) step = 5;
            else step = 10;
            return step * mag;
        }

        function drawLineChart(svgId, points, opts) {
            const svg = document.getElementById(svgId);
            svg.innerHTML = '';
            const W = 320, H = 160, padL = 34, padR = 12, padT = 12, padB = 26;

            if (!points || points.length === 0) {
                const t = document.createElementNS(NS, 'text');
                t.setAttribute('x', W/2); t.setAttribute('y', H/2);
                t.setAttribute('text-anchor', 'middle');
                t.setAttribute('font-size', '10'); t.setAttribute('fill', '#52525b');
                t.textContent = 'Нет данных пока';
                svg.appendChild(t);
                return;
            }

            const ys = points.map(p => p.value);
            let minY = Math.min(...ys, 0), maxY = Math.max(...ys, 0);
            if (minY === maxY) { minY -= 50; maxY += 50; }
            // добавляем запас сверху/снизу, чтобы линия не упиралась в край
            const pad = (maxY - minY) * 0.12;
            minY -= pad; maxY += pad;
            const rangeY = maxY - minY;

            const plotW = W - padL - padR, plotH = H - padT - padB;
            function xPos(i) { return padL + (points.length === 1 ? plotW/2 : plotW * i / (points.length - 1)); }
            function yPos(v) { return padT + plotH - ((v - minY) / rangeY) * plotH; }

            // --- горизонтальная сетка с "красивыми" шагами по Y (в пешках) ---
            const stepCp = niceStep(rangeY, 4);
            const firstTick = Math.ceil(minY / stepCp) * stepCp;
            for (let v = firstTick; v <= maxY; v += stepCp) {
                const y = yPos(v);
                const gridLine = document.createElementNS(NS, 'line');
                gridLine.setAttribute('x1', padL); gridLine.setAttribute('x2', W - padR);
                gridLine.setAttribute('y1', y); gridLine.setAttribute('y2', y);
                gridLine.setAttribute('class', 'chart-grid-line');
                svg.appendChild(gridLine);

                const label = document.createElementNS(NS, 'text');
                label.setAttribute('x', padL - 5); label.setAttribute('y', y + 3);
                label.setAttribute('text-anchor', 'end');
                label.setAttribute('class', 'chart-axis-label');
                label.textContent = (v/100 > 0 ? '+' : '') + (v/100).toFixed(1);
                svg.appendChild(label);
            }

            // --- нулевая линия (акцентная, если 0 в диапазоне) ---
            if (minY < 0 && maxY > 0) {
                const zeroY = yPos(0);
                const zeroLine = document.createElementNS(NS, 'line');
                zeroLine.setAttribute('x1', padL); zeroLine.setAttribute('x2', W - padR);
                zeroLine.setAttribute('y1', zeroY); zeroLine.setAttribute('y2', zeroY);
                zeroLine.setAttribute('stroke', '#52525b'); zeroLine.setAttribute('stroke-width', '1');
                svg.appendChild(zeroLine);
            }

            // --- вертикальные тики по X (подписи оси) ---
            const xTickEvery = Math.max(1, Math.ceil(points.length / 6));
            points.forEach((p, i) => {
                if (i % xTickEvery !== 0 && i !== points.length - 1) return;
                const label = document.createElementNS(NS, 'text');
                label.setAttribute('x', xPos(i)); label.setAttribute('y', H - padB + 13);
                label.setAttribute('text-anchor', 'middle');
                label.setAttribute('class', 'chart-axis-label');
                label.textContent = p.label != null ? p.label : (i + 1);
                svg.appendChild(label);
            });

            // --- область под кривой ---
            const baseY = (minY < 0 && maxY > 0) ? yPos(0) : yPos(minY);
            let areaPath = `M ${xPos(0)} ${baseY} `;
            points.forEach((p, i) => areaPath += `L ${xPos(i)} ${yPos(p.value)} `);
            areaPath += `L ${xPos(points.length-1)} ${baseY} Z`;
            const area = document.createElementNS(NS, 'path');
            area.setAttribute('d', areaPath);
            area.setAttribute('fill', opts.color || '#10b981');
            area.setAttribute('opacity', '0.12');
            svg.appendChild(area);

            // --- сама линия ---
            let linePath = '';
            points.forEach((p, i) => { linePath += (i === 0 ? 'M' : 'L') + ` ${xPos(i)} ${yPos(p.value)} `; });
            const line = document.createElementNS(NS, 'path');
            line.setAttribute('d', linePath);
            line.setAttribute('fill', 'none');
            line.setAttribute('stroke', opts.color || '#10b981');
            line.setAttribute('stroke-width', '2');
            line.setAttribute('stroke-linejoin', 'round');
            line.setAttribute('stroke-linecap', 'round');
            svg.appendChild(line);

            // --- точки с тултипом при наведении ---
            points.forEach((p, i) => {
                const c = document.createElementNS(NS, 'circle');
                c.setAttribute('cx', xPos(i)); c.setAttribute('cy', yPos(p.value));
                c.setAttribute('r', points.length > 25 ? 1.8 : 3);
                c.setAttribute('fill', opts.color || '#10b981');
                c.setAttribute('stroke', '#09090b');
                c.setAttribute('stroke-width', '1');
                c.style.cursor = 'pointer';
                const titleEl = document.createElementNS(NS, 'title');
                titleEl.textContent = `${p.label != null ? p.label : i+1}: ${(p.value/100 > 0 ? '+' : '') + (p.value/100).toFixed(2)}`;
                c.appendChild(titleEl);
                svg.appendChild(c);
            });

            // --- подпись оси X ---
            if (opts.xLabel) {
                const t = document.createElementNS(NS, 'text');
                t.setAttribute('x', W/2); t.setAttribute('y', H - 4);
                t.setAttribute('text-anchor', 'middle');
                t.setAttribute('font-size', '9'); t.setAttribute('fill', '#71717a');
                t.textContent = opts.xLabel;
                svg.appendChild(t);
            }
            // --- подпись оси Y (сбоку, повёрнута) ---
            if (opts.yLabel) {
                const t = document.createElementNS(NS, 'text');
                t.setAttribute('x', 9); t.setAttribute('y', H/2);
                t.setAttribute('text-anchor', 'middle');
                t.setAttribute('font-size', '8'); t.setAttribute('fill', '#52525b');
                t.setAttribute('transform', `rotate(-90 9 ${H/2})`);
                t.textContent = opts.yLabel;
                svg.appendChild(t);
            }
        }

        function renderDepthChart() {
            const pts = currentDepthHistory.map(d => ({ value: d.score, label: d.depth }));
            drawLineChart('depthChart', pts, { color: '#3b82f6', xLabel: 'глубина поиска', yLabel: 'пешки' });
        }
        function renderEvolutionChart() {
            const pts = evolutionHistory.map(e => ({ value: e.score, label: e.ply }));
            drawLineChart('evolutionChart', pts, { color: '#a855f7', xLabel: 'номер полухода', yLabel: 'пешки' });
        }

        // ---------------- Heatmap (с координатами доски и легендой) ----------------
        function renderHeatmap() {
            const svg = document.getElementById('heatmapCanvas');
            svg.innerHTML = '';
            const W = 320, H = 160;
            const padL = 16, padT = 6, padR = 46, padB = 16;
            const boardSize = Math.min(W - padL - padR, H - padT - padB);
            const cell = boardSize / 8;
            const startX = padL, startY = padT;
            const maxVal = Math.max(1, ...Object.values(squareActivity));
            const totalMoves = Object.values(squareActivity).reduce((a,b) => a+b, 0);

            if (totalMoves === 0) {
                const t = document.createElementNS(NS, 'text');
                t.setAttribute('x', W/2); t.setAttribute('y', H/2);
                t.setAttribute('text-anchor', 'middle');
                t.setAttribute('font-size', '10'); t.setAttribute('fill', '#52525b');
                t.textContent = 'Нет ходов пока';
                svg.appendChild(t);
                return;
            }

            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const sq = 'abcdefgh'[f] + (8 - r);
                    const val = squareActivity[sq] || 0;
                    const intensity = val / maxVal;
                    const rect = document.createElementNS(NS, 'rect');
                    rect.setAttribute('x', startX + f*cell);
                    rect.setAttribute('y', startY + r*cell);
                    rect.setAttribute('width', cell - 1);
                    rect.setAttribute('height', cell - 1);
                    rect.setAttribute('rx', 1.5);
                    const alpha = val === 0 ? 0.06 : 0.15 + intensity * 0.75;
                    rect.setAttribute('fill', `rgba(249, 115, 22, ${alpha.toFixed(2)})`);
                    if (val > 0) {
                        const titleEl = document.createElementNS(NS, 'title');
                        titleEl.textContent = `${sq}: ${val} раз(а)`;
                        rect.appendChild(titleEl);
                    }
                    svg.appendChild(rect);
                }
            }

            // подписи файлов (a-h) снизу
            for (let f = 0; f < 8; f++) {
                const t = document.createElementNS(NS, 'text');
                t.setAttribute('x', startX + f*cell + cell/2);
                t.setAttribute('y', startY + boardSize + 11);
                t.setAttribute('text-anchor', 'middle');
                t.setAttribute('class', 'chart-axis-label');
                t.textContent = 'abcdefgh'[f];
                svg.appendChild(t);
            }
            // подписи горизонталей (8-1) слева
            for (let r = 0; r < 8; r++) {
                const t = document.createElementNS(NS, 'text');
                t.setAttribute('x', startX - 5);
                t.setAttribute('y', startY + r*cell + cell/2 + 3);
                t.setAttribute('text-anchor', 'end');
                t.setAttribute('class', 'chart-axis-label');
                t.textContent = 8 - r;
                svg.appendChild(t);
            }

            // цветовая легенда справа
            const legendX = startX + boardSize + 14;
            const legendH = boardSize;
            const steps = 5;
            for (let s = 0; s < steps; s++) {
                const alpha = 0.1 + (s / (steps-1)) * 0.8;
                const rect = document.createElementNS(NS, 'rect');
                rect.setAttribute('x', legendX);
                rect.setAttribute('y', startY + legendH - (s+1) * (legendH/steps));
                rect.setAttribute('width', 12);
                rect.setAttribute('height', legendH/steps - 1);
                rect.setAttribute('fill', `rgba(249, 115, 22, ${alpha.toFixed(2)})`);
                svg.appendChild(rect);
            }
            const legendLabelTop = document.createElementNS(NS, 'text');
            legendLabelTop.setAttribute('x', legendX + 16); legendLabelTop.setAttribute('y', startY + 6);
            legendLabelTop.setAttribute('class', 'chart-axis-label');
            legendLabelTop.textContent = maxVal;
            svg.appendChild(legendLabelTop);
            const legendLabelBottom = document.createElementNS(NS, 'text');
            legendLabelBottom.setAttribute('x', legendX + 16); legendLabelBottom.setAttribute('y', startY + legendH);
            legendLabelBottom.setAttribute('class', 'chart-axis-label');
            legendLabelBottom.textContent = '0';
            svg.appendChild(legendLabelBottom);
        }

        // ---------------- Worker wiring ----------------
        const workerCode = document.getElementById('worker-code').textContent;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const engineWorker = new Worker(URL.createObjectURL(blob));

        engineWorker.onmessage = function(e) {
            const data = e.data;

            if (data.type === 'READY') {
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500"></span>${data.msg}`;
            }

            else if (data.type === 'PROGRESS') {
                mDepth.textContent = data.depth;
                mNodes.textContent = data.nodes.toLocaleString('ru');
                mNps.textContent = data.nps.toLocaleString('ru');
                mTime.textContent = (data.elapsedMs/1000).toFixed(1) + 's';
                mPrune.textContent = data.prunes.toLocaleString('ru');
                if (data.rootLines && data.rootLines.length) {
                    mScore.textContent = fmtScore(data.rootLines[0].score);
                    searchInfoEl.textContent = `лучший: ${data.rootLines[0].san}`;
                    renderTopLines(data.rootLines);
                    pvLineEl.textContent = data.rootLines[0].san + (data.rootLines[0].score != null ? '  (' + fmtScore(data.rootLines[0].score) + ')' : '');
                }
                if (data.tree) renderTree(data.tree);
            }

            else if (data.type === 'BEST_MOVE') {
                if (game.turn() === 'w') return;

                if (data.depthHistory && data.depthHistory.length) {
                    currentDepthHistory = data.depthHistory;
                    renderDepthChart();
                }

                if (data.move) {
                    const from = data.move.substring(0,2), to = data.move.substring(2,4);
                    game.move({ from, to, promotion: data.move.charAt(4) || 'q' });
                    squareActivity[from] = (squareActivity[from]||0) + 1;
                    squareActivity[to] = (squareActivity[to]||0) + 2;
                    board.position(game.fen());
                    updateUI();
                    recordEvolution();
                    renderHeatmap();
                }
            }
        };

        engineWorker.postMessage({ type: 'INIT' });

        function recordEvolution() {
            // оцениваем позицию материально+позиционно с точки зрения белых, для графика партии
            const b = game.board();
            const DEFAULT_MATERIAL = { p:100,n:320,b:330,r:500,q:900,k:0 };
            let score = 0;
            for (const row of b) for (const p of row) if (p) score += (p.color === 'w' ? 1 : -1) * DEFAULT_MATERIAL[p.type];
            evolutionHistory.push({ ply: evolutionHistory.length + 1, score });
            renderEvolutionChart();
        }

        function updateUI() {
            const history = game.history();
            let html = '';
            for (let i = 0; i < history.length; i += 2) {
                html += `<div class="text-zinc-500 flex justify-between"><span class="text-zinc-600">${Math.floor(i/2) + 1}.</span> <span class="text-zinc-200">${history[i]}</span></div>`;
                html += history[i+1] ? `<div class="text-right text-zinc-400">${history[i+1]}</div>` : `<div></div>`;
            }
            historyEl.innerHTML = html;
            historyEl.scrollTop = historyEl.scrollHeight;

            if (game.game_over()) {
                statusEl.innerHTML = game.in_checkmate() ?
                    '<span class="w-2 h-2 rounded-full bg-red-500"></span>Мат!' :
                    '<span class="w-2 h-2 rounded-full bg-zinc-500"></span>Ничья';
            } else {
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500"></span>Ваш ход';
            }
        }

        function showHighlights(square) {
            clearHighlights();
            $('#board .square-' + square).addClass('highlight-selected');
            const moves = game.moves({ square: square, verbose: true });
            moves.forEach(m => {
                const sqEl = $('#board .square-' + m.to);
                if (m.flags.includes('c') || m.flags.includes('e')) sqEl.addClass('highlight-capture');
                else sqEl.addClass('highlight-move');
            });
        }
        function clearHighlights() {
            $('#board .square-55d63').removeClass('highlight-move highlight-capture highlight-selected');
        }

        function onDragStart(source, piece) {
            if (game.game_over() || piece.search(/^b/) !== -1 || game.turn() === 'b') return false;
            selectedSquare = source;
            showHighlights(source);
        }
        function onDrop(source, target) {
            clearHighlights();
            selectedSquare = null;
            const move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            squareActivity[source] = (squareActivity[source]||0)+1;
            squareActivity[target] = (squareActivity[target]||0)+2;
            updateUI();
            recordEvolution();
            renderHeatmap();
            triggerEngine();
        }
        function onSnapEnd() { board.position(game.fen()); }

        $('#board').on('click', '.square-55d63', function() {
            if (game.game_over() || game.turn() === 'b') return;
            const square = $(this).attr('data-square');
            const piece = game.get(square);

            if (selectedSquare === square) { selectedSquare = null; clearHighlights(); return; }
            if (piece && piece.color === 'w') { selectedSquare = square; showHighlights(square); return; }

            if (selectedSquare) {
                const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move !== null) {
                    squareActivity[selectedSquare] = (squareActivity[selectedSquare]||0)+1;
                    squareActivity[square] = (squareActivity[square]||0)+2;
                    board.position(game.fen());
                    selectedSquare = null;
                    clearHighlights();
                    updateUI();
                    recordEvolution();
                    renderHeatmap();
                    triggerEngine();
                } else {
                    selectedSquare = null;
                    clearHighlights();
                }
            }
        });

        function triggerEngine() {
            if (!game.game_over()) {
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>Думает...';
                searchInfoEl.textContent = '';
                engineWorker.postMessage({ type: 'SEARCH', fen: game.fen() });
            }
        }

        window.resetGame = function() {
            game.reset();
            board.start();
            selectedSquare = null;
            clearHighlights();
            evolutionHistory = [];
            for (const k in squareActivity) squareActivity[k] = 0;
            currentDepthHistory = [];
            renderEvolutionChart();
            renderDepthChart();
            renderHeatmap();
            renderTopLines([]);
            pvLineEl.textContent = '';
            searchInfoEl.textContent = '';
            mDepth.textContent = mScore.textContent = mNodes.textContent = mNps.textContent = mTime.textContent = mPrune.textContent = '—';
            updateUI();
        };

        window.undoMove = function() {
            if (game.history().length === 0) return;
            if (game.turn() === 'b') { game.undo(); }
            else { game.undo(); game.undo(); }
            board.position(game.fen());
            selectedSquare = null;
            clearHighlights();
            updateUI();
        };

        let board = Chessboard('board', {
            draggable: true,
            position: 'start',
            moveSpeed: 150,
            snapbackSpeed: 200,
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        // init empty charts
        renderEvolutionChart();
        renderDepthChart();
        renderHeatmap();
        renderTopLines([]);
        window.addEventListener('resize', () => { if (window.__lastTree) renderTree(window.__lastTree); });
    </script>
</body>
</html>
