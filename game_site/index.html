<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texel Chess Engine</title>
    <!-- Подключаем Tailwind для стилей -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { color-scheme: dark; }
        body { background-color: #09090b; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        /* Кастомный скроллбар для брутализма */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    </style>
</head>
<body class="text-zinc-100 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-2xl flex flex-col gap-6">
        <!-- Header -->
        <header class="flex justify-between items-end border-b border-zinc-800 pb-4">
            <h1 class="text-4xl font-bold tracking-tighter">TEXEL ENGINE</h1>
            <span id="status" class="text-sm font-mono text-zinc-400">waiting...</span>
        </header>

        <!-- Loading Progress -->
        <div id="loader" class="flex flex-col gap-2">
            <div class="flex justify-between text-sm font-mono">
                <span>Weights max 100 mb</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="w-full bg-zinc-900 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-zinc-100 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Chessboard Placeholder -->
        <div id="board-container" class="hidden aspect-square bg-zinc-900 border border-zinc-800 rounded-lg flex items-center justify-center shadow-xl">
            <!-- Здесь будет инициализироваться доска (например, через chessboard.js) -->
            <p class="text-zinc-500 font-mono text-sm">Your move bro)</p>
        </div>

        <!-- Controls -->
        <div class="flex gap-4">
            <button onclick="startGame()" class="px-4 py-2 bg-zinc-100 text-zinc-900 font-medium rounded hover:bg-zinc-300 transition-colors hidden" id="start-btn">
                New game
            </button>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const loaderEl = document.getElementById('loader');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const boardContainer = document.getElementById('board-container');
        const startBtn = document.getElementById('start-btn');

        // Инициализируем Web Worker
        const engineWorker = new Worker('worker.js');

        // Слушаем ответы от воркера
        engineWorker.onmessage = (e) => {
            const { type, payload } = e.data;

            if (type === 'ENGINE_READY') {
                statusEl.textContent = 'Lets go';
                statusEl.classList.add('text-green-500');
                loaderEl.classList.add('hidden');
                boardContainer.classList.remove('hidden');
                boardContainer.classList.add('flex');
                startBtn.classList.remove('hidden');
            }

            if (type === 'BEST_MOVE') {
                statusEl.textContent = `My move: ${payload.move}`;
                // TODO: Отрисовать ход на доске
            }
        };

        // Функция скачивания файла с отслеживанием прогресса
        async function fetchWeights() {
            statusEl.textContent = 'Download files...';
            
            try {
                const response = await fetch('/weights.bin'); // Твой файл в корне проекта
                if (!response.ok) throw new Error('Do not exist');

                const contentLength = response.headers.get('content-length');
                const total = parseInt(contentLength, 10);
                let loaded = 0;

                const reader = response.body.getReader();
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    chunks.push(value);
                    loaded += value.length;

                    if (total) {
                        const percent = Math.round((loaded / total) * 100);
                        progressBar.style.width = `${percent}%`;
                        progressText.textContent = `${percent}%`;
                    }
                }

                // Собираем куски в один ArrayBuffer
                const result = new Uint8Array(loaded);
                let position = 0;
                for (let chunk of chunks) {
                    result.set(chunk, position);
                    position += chunk.length;
                }

                statusEl.textContent = 'Init engine...';
                // Передаем ArrayBuffer в воркер. Трансфер памяти (result.buffer) работает без копирования, что очень быстро.
                engineWorker.postMessage({ type: 'INIT', weights: result.buffer }, [result.buffer]);

            } catch (error) {
                statusEl.textContent = 'Error load';
                statusEl.classList.add('text-red-500');
                console.error(error);
            }
        }

        function startGame() {
            statusEl.textContent = 'Hmmm...';
            // Пример отправки позиции в воркер
            engineWorker.postMessage({ 
                type: 'CALCULATE', 
                payload: { fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1', depth: 15 } 
            });
        }

        // Запускаем загрузку при старте
        window.addEventListener('load', fetchWeights);
    </script>
</body>
</html>
