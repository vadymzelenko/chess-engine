<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Engine</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <style>
        :root { color-scheme: dark; }
        body { background-color: #09090b; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
        #board { border: 1px solid #27272a; border-radius: 4px; overflow: hidden; filter: grayscale(100%) contrast(1.1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    </style>
</head>
<body class="text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-3xl grid grid-cols-1 md:grid-cols-[2fr_1fr] gap-8 items-start">
        <div class="flex flex-col gap-4">
            <div class="flex justify-between items-end">
                <h1 class="text-3xl font-bold tracking-tighter">CUSTOM ENGINE</h1>
                <div id="status" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded-full text-xs font-mono text-amber-400">
                    Загрузка weights.json...
                </div>
            </div>
            <div id="board" class="w-full aspect-square shadow-2xl"></div>
        </div>

        <div class="flex flex-col gap-4 bg-zinc-900/50 p-6 rounded-xl border border-zinc-800 h-full">
            <button onclick="resetGame()" class="w-full py-2.5 bg-zinc-100 text-zinc-900 font-semibold rounded-md hover:bg-white transition-colors">
                Новая игра
            </button>
            <div id="history" class="flex-1 bg-zinc-950 rounded border border-zinc-800 p-3 overflow-y-auto font-mono text-sm text-zinc-300 flex flex-col gap-1 min-h-[200px]"></div>
        </div>
    </div>

    <!-- ВСТРОЕННЫЙ ВОРКЕР (Загрузка весов и поиск ходов) -->
    <script id="worker-code" type="text/worker">
        importScripts('https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js');
        
        let customWeights = null;
        const engine = new Chess();

        self.onmessage = async function(e) {
            const { type, fen, depth } = e.data;

            if (type === 'INIT') {
                try {
                    // Скачиваем твой weights.json, лежащий рядом с index.html
                    const res = await fetch('/weights.json');
                    customWeights = await res.json();
                    self.postMessage({ type: 'READY' });
                } catch (error) {
                    self.postMessage({ type: 'ERROR', msg: 'Не удалось загрузить weights.json' });
                }
            }

            if (type === 'SEARCH') {
                const bestMove = searchBestMove(fen, depth || 3);
                self.postMessage({ type: 'BEST_MOVE', move: bestMove });
            }
        };

        function searchBestMove(fen, depth) {
            engine.load(fen);
            const moves = engine.moves({ verbose: true });
            
            let bestMove = null;
            let bestValue = -Infinity;
            let alpha = -Infinity;
            let beta = Infinity;
            
            for (let i = 0; i < moves.length; i++) {
                engine.move(moves[i]);
                const boardValue = -alphaBeta(depth - 1, -beta, -alpha);
                engine.undo();
                
                if (boardValue > bestValue) {
                    bestValue = boardValue;
                    bestMove = moves[i];
                }
                alpha = Math.max(alpha, boardValue);
            }
            return bestMove ? (bestMove.from + bestMove.to + (bestMove.promotion || '')) : null;
        }

        function alphaBeta(depth, alpha, beta) {
            if (depth === 0) return evaluateBoard();
            
            const moves = engine.moves();
            if (moves.length === 0) return engine.in_check() ? -99999 : 0;
            
            let bestValue = -Infinity;
            for (let i = 0; i < moves.length; i++) {
                engine.move(moves[i]);
                bestValue = Math.max(bestValue, -alphaBeta(depth - 1, -beta, -alpha));
                engine.undo();
                
                alpha = Math.max(alpha, bestValue);
                if (alpha >= beta) break;
            }
            return bestValue;
        }

        function evaluateBoard() {
            const board = engine.board();
            let score = 0;
            
            // Базовые значения, если в weights.json что-то не так
            const defaults = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
            
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = board[i][j];
                    if (piece) {
                        // ТУТ ИСПОЛЬЗУЮТСЯ ТВОИ ВЕСА
                        // Если структура JSON другая - просто поменяй ключи ниже
                        let val = defaults[piece.type];
                        if (customWeights && customWeights[piece.type]) {
                            val = customWeights[piece.type]; 
                        }
                        
                        score += piece.color === 'w' ? val : -val;
                    }
                }
            }
            return engine.turn() === 'w' ? score : -score;
        }
    </script>

    <!-- ОСНОВНАЯ ЛОГИКА ИНТЕРФЕЙСА -->
    <script>
        const game = new Chess();
        const statusEl = document.getElementById('status');
        const historyEl = document.getElementById('history');

        const workerCode = document.getElementById('worker-code').textContent;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const engineWorker = new Worker(URL.createObjectURL(blob));

        engineWorker.onmessage = function(e) {
            const { type, msg, move } = e.data;

            if (type === 'READY') {
                statusEl.innerHTML = '<span class="text-green-500">Готов (веса загружены)</span>';
            } else if (type === 'ERROR') {
                statusEl.innerHTML = `<span class="text-red-500">${msg}</span>`;
            } else if (type === 'BEST_MOVE') {
                if (move) {
                    game.move({ from: move.substring(0, 2), to: move.substring(2, 4), promotion: move.charAt(4) || 'q' });
                    board.position(game.fen());
                    updateUI();
                }
            }
        };

        engineWorker.postMessage({ type: 'INIT' });

        function updateUI() {
            historyEl.innerHTML = game.history().map((m, i) => `<div>${Math.floor(i/2)+1}. ${m}</div>`).join('');
            historyEl.scrollTop = historyEl.scrollHeight;

            if (game.game_over()) {
                statusEl.innerHTML = game.in_checkmate() ? '<span class="text-red-500">Мат!</span>' : '<span class="text-zinc-500">Ничья</span>';
            } else {
                statusEl.innerHTML = '<span class="text-green-500">Ваш ход</span>';
            }
        }

        function onDrop(source, target) {
            if (game.move({ from: source, to: target, promotion: 'q' }) === null) return 'snapback';
            
            board.position(game.fen());
            updateUI();

            if (!game.game_over()) {
                statusEl.innerHTML = '<span class="text-amber-500 animate-pulse">Движок думает...</span>';
                engineWorker.postMessage({ type: 'SEARCH', fen: game.fen(), depth: 3 });
            }
        }

        let board = Chessboard('board', {
            draggable: true,
            position: 'start',
            onDragStart: (s, p) => !game.game_over() && !p.startsWith('b'),
            onDrop: onDrop,
            onSnapEnd: () => board.position(game.fen()),
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        window.resetGame = function() {
            game.reset();
            board.start();
            updateUI();
        };
    </script>
</body>
</html>
